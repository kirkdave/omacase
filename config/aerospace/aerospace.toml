config-version = 2

start-at-login = true
automatically-unhide-macos-hidden-apps = true

# Layout Defaults
accordion-padding = 30
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

# Tree Normalisation
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

focus-follows-mouse.enabled = false
on-focused-monitor-changed = []
on-focus-changed = []

persistent-workspaces = [
    "1",
    "2",
    "3",
    "4",
    "5",
    "6",
    "7",
    "8",
    "9"
]

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.top        = [{monitor.'built-in' = 16}, 48]
    outer.right      = 8


[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id="com.mitchellh.ghostty"
    run = 'layout tiling'

[[on-window-detected]]
    if.app-id = "com.spotify.client"
    run = 'layout tiling'
[[on-window-detected]]
    if.app-id = "com.microsoft.Outlook"
    run = "layout tiling"

[[on-window-detected]]
    if.app-id = "com.microsoft.teams2"
    run = "layout tiling"

[mode.main.binding]
    # ctrl-shift-option-cmd = Hyper key (Right Cmd configured in Raycast)
    ctrl-shift-cmd-alt-f = 'fullscreen'

    # Move and swap windows
    ctrl-shift-cmd-alt-h = 'focus left'
    ctrl-shift-cmd-alt-l = 'focus right'
    ctrl-shift-cmd-alt-k = 'focus down'
    ctrl-shift-cmd-alt-j = 'focus up'

    cmd-left  = 'move left'
    cmd-down  = 'move down'
    cmd-up    = 'move up'
    cmd-right = 'move right'

    ctrl-shift-cmd-alt-minus = 'resize smart -50'
    ctrl-shift-cmd-alt-equal = 'resize smart +50'

    ctrl-shift-cmd-alt-b = 'balance-sizes'

    ctrl-shift-cmd-alt-leftSquareBracket = 'layout tiles horizontal vertical'

    # Workspace switching (number-based)
    ctrl-shift-cmd-alt-1 = 'workspace 1'
    ctrl-shift-cmd-alt-2 = 'workspace 2'
    ctrl-shift-cmd-alt-3 = 'workspace 3'
    ctrl-shift-cmd-alt-4 = 'workspace 4'
    ctrl-shift-cmd-alt-5 = 'workspace 5'
    ctrl-shift-cmd-alt-6 = 'workspace 6'
    ctrl-shift-cmd-alt-7 = 'workspace 7'
    ctrl-shift-cmd-alt-8 = 'workspace 8'
    ctrl-shift-cmd-alt-9 = 'workspace 9'

    ctrl-cmd-1 = 'move-node-to-workspace 1'
    ctrl-cmd-2 = 'move-node-to-workspace 2'
    ctrl-cmd-3 = 'move-node-to-workspace 3'
    ctrl-cmd-4 = 'move-node-to-workspace 4'
    ctrl-cmd-5 = 'move-node-to-workspace 5'
    ctrl-cmd-6 = 'move-node-to-workspace 6'
    ctrl-cmd-7 = 'move-node-to-workspace 7'
    ctrl-cmd-8 = 'move-node-to-workspace 8'
    ctrl-cmd-9 = 'move-node-to-workspace 9'

    ctrl-shift-cmd-alt-comma = 'workspace-back-and-forth'
    ctrl-shift-cmd-alt-backtick = 'move-workspace-to-monitor --wrap-around next'

    ctrl-shift-cmd-alt-period = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']    # Reset layout
    f = ['layout floating tiling', 'mode main']    # Toggle float/tile
