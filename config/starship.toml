"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200
format = """
[](red)\
$directory\
[](bg:yellow fg:red)\
$git_branch\
$git_status\
[](fg:yellow)
$line_break\
$character"""

palette = 'catppuccin_mocha'

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold green)"

[directory]
style = "bg:red fg:crust"
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"
format = "[ $path ]($style)"

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "bg:yellow fg:crust"

[git_status]
format     = '[ $all_status ]($style)'
style      = "bg:yellow fg:crust"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
